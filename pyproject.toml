[project]
name = "teamgym-watcher"
version = "0.1.0"
description = "Watches an import directory for TeamGym competition photos, matches them to tags from the teamgym-sorter API by capture time, and moves them into a Zenfolio-ready folder hierarchy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "watchdog>=4.0",
    "exifread>=3.0",
    "platformdirs>=4.2",
]

[project.scripts]
teamgym-watcher = "teamgym_watcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamgym_watcher"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
