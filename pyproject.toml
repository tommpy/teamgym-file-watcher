[project]
name = "teamgym-watcher"
version = "0.1.0"
description = "Watches an import directory for TeamGym competition photos, matches them to tags from the teamgym-sorter API by capture time, and moves them into a Zenfolio-ready folder hierarchy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "watchdog>=4.0",
    "exifread>=3.0",
    "platformdirs>=4.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
teamgym-watcher = "teamgym_watcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamgym_watcher"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end pipeline tests against tmp filesystem + faked API (slower; skip locally with -m \"not integration\")",
]

[tool.coverage.run]
source = ["src/teamgym_watcher"]
branch = true

[tool.coverage.report]
show_missing = true
# Overall floor. The parity-critical modules (mapping.py, hierarchy.py, matcher.py) have
# their own stricter 90% floor enforced separately in CI via a scoped --cov-fail-under run
# (see .github/workflows/ci.yml and prompts/rules/testing.md) since coverage.py has no
# native per-module fail-under.
fail_under = 85
